name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build distribution
        run: npm run build

      - name: Check if distribution is up to date
        run: |
          CHANGES="$(git status --porcelain -- dist/)"
          if [ -z "$CHANGES" ]; then
            echo "✓ Distribution is up to date"
          else
            echo "✗ Distribution is outdated. Run 'npm run build' and commit changes."
            echo "$CHANGES"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
